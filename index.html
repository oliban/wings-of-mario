<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SUPER MARIO</title>
<style>
  :root {
    --bezel: #0a0c12;
    --glow: #4d7dff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05060a;
    color: #cdd6f4;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(120% 90% at 50% 0%, #131a2e 0%, #070910 55%, #04050a 100%);
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(75% 60% at 50% 45%, transparent 40%, rgba(0,0,0,.75) 100%);
  }
  #stage {
    position: relative;
    display: grid;
    place-items: center;
    padding: 18px;
    border-radius: 18px;
    background: linear-gradient(180deg, #12151f 0%, #0a0c12 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05),
      0 30px 80px -20px rgba(0,0,0,.9),
      0 0 120px -30px var(--glow);
  }
  #screen {
    display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    border-radius: 4px;
    background: #000;
    box-shadow: 0 0 0 2px #000, 0 0 46px -6px rgba(77,125,255,.45);
    touch-action: none;
  }
  #overlay {
    position: absolute;
    left: 18px;
    top: 18px;
    pointer-events: none;
    z-index: 2;
    border-radius: 4px;
  }
  body.headless #overlay { left: 0; top: 0; }
  #boot {
    position: absolute;
    inset: 18px;
    display: grid;
    place-items: center;
    background: #000;
    border-radius: 4px;
    z-index: 5;
    transition: opacity .35s ease;
    font-size: 12px;
    letter-spacing: .28em;
    color: #6b7db8;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .bar {
    margin-top: 14px;
    width: 180px; height: 3px;
    background: #131a2e;
    overflow: hidden;
    border-radius: 2px;
  }
  #boot .bar i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #4d7dff, #7de2ff);
    transition: width .2s ease;
  }
  #hint {
    position: fixed;
    bottom: 18px;
    left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: .22em;
    color: #46527a;
    pointer-events: none;
    transition: opacity .6s ease;
    z-index: 3;
  }
  #hint b { color: #7f92c9; font-weight: 600; }
  #hint.gone { opacity: 0; }
  /* Capture mode: strip every page-level decoration so an element screenshot of
     #screen contains the framebuffer and nothing else. The page vignette in
     particular reads as a spotlight in the sky if it is left on. */
  body.headless { background: #000; }
  body.headless::after { display: none; }
  body.headless #stage { box-shadow: none; background: none; padding: 0; border-radius: 0; }
  body.headless #screen { box-shadow: none; border-radius: 0; }
  body.headless #hint { display: none; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="1024" height="960"></canvas>
    <!-- Painted at display resolution, above the pixel grid. Used by Harry mode so
         the photo stays sharp instead of being crushed into the 256x240 buffer. -->
    <canvas id="overlay"></canvas>
    <div id="boot">BOOTING<div class="bar"><i></i></div></div>
  </div>
  <div id="hint">
    <b>P1</b> &larr; &rarr; MOVE &nbsp;·&nbsp; <b>SPACE</b> JUMP &nbsp;·&nbsp; <b>.</b> RUN
    &nbsp;&nbsp;|&nbsp;&nbsp;
    <b>P2</b> <b>A</b> <b>D</b> MOVE &nbsp;·&nbsp; <b>F</b> JUMP &nbsp;·&nbsp; <b>Z</b> RUN
    &nbsp;&nbsp;|&nbsp;&nbsp; <b>ENTER</b> PAUSE &nbsp;·&nbsp; <b>F</b>ILTER
  </div>
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/wings/debug-panel.js"></script>
</body>
</html>
