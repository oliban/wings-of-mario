app = 'mario-game'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in this process's memory. 'stop' would kill the machine when the
  # last request goes quiet, dropping every open WebSocket and evaporating every
  # live match; 'suspend' keeps the memory. One machine always running means a
  # player joining a code their friend read out five minutes ago still finds the
  # room instead of a cold, empty one. This costs money — it is a deliberate
  # trade, not a default.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.http_options.response.headers]
    # The renderer reads pixels back through WebGL2; keep the page same-origin clean.
    X-Content-Type-Options = 'nosniff'

[[http_service.checks]]
  grace_period = '5s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
